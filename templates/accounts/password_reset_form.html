{% extends 'layout/auth-layout.html' %}

{% block title %}Forgot Password{% endblock %}

{% block header %}Enter your email and we'll send you a link to reset your password.{% endblock %}

{% block layout %}

{% if form.email.errors %}
<div class="mb-4 text-sm text-red-600">{{ form.email.errors.0 }}</div>
{% endif %}

<div class="mb-6">
    <label for="{{ form.email.id_for_label }}"
        class="block text-sm font-semibold mb-2 text-gray-600">Email Address</label>
    <input type="email" id="{{ form.email.id_for_label }}" name="{{ form.email.html_name }}"
        class="py-3 px-4 block w-full border-gray-200 rounded-md text-sm focus:border-blue-600 focus:ring-0"
        placeholder="you@example.com" required>
</div>

<div class="grid my-6">
    <button type="submit"
        class="btn py-[10px] text-base text-white font-medium bg-blue-600 hover:bg-blue-700 rounded-lg">Send Reset Link</button>
</div>

<div class="flex justify-center gap-2 items-center">
    <a href="{% url 'staff_login' %}" class="text-sm font-medium text-blue-600 hover:text-blue-700">Back to Login</a>
</div>

{% endblock %}
