{% load static %}

<aside
  id="application-sidebar-brand"
  class="hs-overlay hs-overlay-open:translate-x-0 -translate-x-full transform hidden xl:block xl:translate-x-0 xl:end-auto xl:bottom-0 fixed top-0 with-vertical h-screen z-[999] flex-shrink-0 border-r-[1px] w-[270px] border-gray-400 bg-white left-sidebar transition-all duration-300 flex flex-col"
>
  <!-- ---------------------------------- -->
  <!-- Start Vertical Layout Sidebar -->
  <!-- ---------------------------------- -->
  <div class="p-4 flex flex-col items-center justify-center">
    <a href="{% url 'dashboard:admin_dashboard' %}" class="flex flex-col items-center justify-center">
      <img
        src="{% static 'assets/images/logos/lakeview.jpg' %}"
        width="100px"
        height="100px"
        style="border: solid 1px"
        alt="Logo-Dark"
        class="rounded-full ring-2 ring-black"
      />
      <h2 class="font-semibold text-2xl my-2 text-right">LakeView <br> College of Education</h2>
      <small class="font-light text-center text-xm text-slate-600"
        >Opposite Specialist Hospital, Off Jolly Nyame Way Jalingo, Taraba
        State.</small
      >
      <span class="mt-2 inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-purple-100 text-purple-800">
        School Admin
      </span>
    </a>
  </div>
  <div class="scroll-sidebar overflow-y-auto flex-1" data-simplebar="" style="max-height: calc(100vh - 220px);">
    <div class="px-6 mt-8">
      <nav class="w-full flex flex-col sidebar-nav">
        <ul id="sidebarnav" class="text-gray-600 text-sm">

          <li class="sidebar-item">
            <a
              class="sidebar-link gap-3 py-2 px-3 rounded-md w-full flex items-center hover:text-white hover:bg-blue-500"
              href="{% url 'dashboard:admin_dashboard' %}"
            >
              <i class="ti ti-layout-dashboard text-xl"></i>
              <span>Dashboard</span>
            </a>
          </li>

          <li class="sidebar-item">
            <a
              class="sidebar-link gap-3 py-2 px-3 rounded-md w-full flex items-center hover:text-white hover:bg-blue-500"
              href="{% url 'accounts:manage_courses' %}"
            >
              <i class="ti ti-cards text-xl"></i> <span>Manage Courses</span>
            </a>
          </li>

          <li class="sidebar-item">
            <a
              class="sidebar-link gap-3 py-2 px-3 rounded-md w-full flex items-center hover:text-white hover:bg-blue-500"
              href="{% url 'accounts:create_course' %}"
            >
              <i class="ti ti-plus text-xl"></i> <span>Create Course</span>
            </a>
          </li>

          <li class="sidebar-item">
            <a
              class="sidebar-link gap-3 py-2 px-3 rounded-md w-full flex items-center hover:text-white hover:bg-blue-500"
              href="/admin/"
            >
              <i class="ti ti-settings text-xl"></i> <span>Django Admin</span>
            </a>
          </li>

          <li class="sidebar-item">
            <a
              class="sidebar-link gap-3 py-2 px-3 rounded-md w-full flex items-center hover:text-white hover:bg-blue-500"
              href="{% url 'accounts:logout' %}"
            >
              <i class="ti ti-logout text-xl"></i> <span>Logout</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <!-- </aside> -->
</aside>
